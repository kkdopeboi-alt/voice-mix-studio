[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-mix-studio"
version = "1.4.0"
description = "A script-driven desktop video editor with narration, mixed media and editable drafts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "edge-tts==7.3.1",
  "pillow==13.0.0",
  "pillow-heif==1.8.1",
]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]
build = ["pyinstaller==6.22.3"]
test = ["httpx>=0.28,<1"]
mv = ["faster-whisper==1.4.0", "yt-dlp==2026.10.26", "numpy>=1.26,<3", "onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "huggingface-hub>=0.26,<3"]

[project.gui-scripts]
voice-mix-studio = "voice_mix.desktop:main"

[tool.setuptools.packages.find]
include = ["voice_mix"]

[tool.setuptools.package-data]
voice_mix = ["static/*.html", "static/*.css", "static/*.js"]
